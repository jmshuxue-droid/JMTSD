<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMTMATH 학생현황</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div class="max-w-4xl mx-auto p-4">
        <!-- 헤더 -->
        <header class="mb-6 flex justify-between items-end border-b pb-4">
            <h1 class="text-2xl font-bold text-blue-600 tracking-tight">JMTMATH 학생현황</h1>
            <div class="flex space-x-4">
                <button id="tab-input" class="pb-2 tab-active" onclick="switchTab('input')">학생 관리 (입력)</button>
                <button id="tab-output" class="pb-2 text-gray-500" onclick="switchTab('output')">납부 현황 (출력)</button>
            </div>
        </header>

        <!-- 학생 관리 (입력) 화면 -->
        <div id="view-input">
            <div class="bg-white p-4 rounded-lg shadow-sm mb-6">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">학생 정보 입력/수정</h2>
                <form id="student-form" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                    <input type="hidden" id="doc-id">
                    <input type="text" id="s-name" placeholder="이름" class="border p-2 rounded w-full" required>
                    <input type="text" id="s-school" placeholder="학교" class="border p-2 rounded w-full">
                    <input type="text" id="s-grade" placeholder="학년" class="border p-2 rounded w-full">
                    <input type="text" id="s-class" placeholder="분반" class="border p-2 rounded w-full" required>
                    <div><label class="text-xs text-gray-500">등록일자</label><input type="date" id="s-regDate" class="border p-2 rounded w-full"></div>
                    <div><label class="text-xs text-gray-500">매월 납입일</label><input type="number" id="s-payDay" placeholder="예: 15" class="border p-2 rounded w-full" min="1" max="31"></div>
                    <input type="number" id="s-tuition" placeholder="학비(원)" class="border p-2 rounded w-full" required>
                    <select id="s-payStatus" class="border p-2 rounded w-full">
                        <option value="미납">당월 미납</option>
                        <option value="납부완료">당월 납부완료</option>
                    </select>
                    <div><label class="text-xs text-gray-500">퇴원일(해당시)</label><input type="date" id="s-dropDate" class="border p-2 rounded w-full"></div>
                    
                    <div class="col-span-2 md:col-span-3 flex justify-end space-x-2 mt-2">
                        <button type="button" onclick="clearForm()" class="px-4 py-2 bg-gray-200 rounded text-gray-700">초기화</button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded shadow hover:bg-blue-700">저장</button>
                    </div>
                </form>
            </div>

            <!-- 학생 명단 테이블 -->
            <div class="bg-white rounded-lg shadow-sm overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-gray-100 text-gray-600">
                        <tr>
                            <th class="p-3">이름</th><th class="p-3">학교/학년</th><th class="p-3">분반</th>
                            <th class="p-3">학비(납입일)</th><th class="p-3">상태</th><th class="p-3">관리</th>
                        </tr>
                    </thead>
                    <tbody id="student-list" class="divide-y">
                        <!-- JS에서 데이터 렌더링 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 납부 현황 (출력) 화면 -->
        <div id="view-output" class="hidden">
            <!-- 상단 요약 대시보드 -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-blue-50 p-6 rounded-lg shadow-sm border border-blue-100 flex flex-col items-center">
                    <span class="text-sm text-blue-600 font-semibold mb-1">당월 납부 총 인원수</span>
                    <span id="total-paid-count" class="text-3xl font-bold text-gray-800">0명</span>
                </div>
                <div class="bg-green-50 p-6 rounded-lg shadow-sm border border-green-100 flex flex-col items-center">
                    <span class="text-sm text-green-600 font-semibold mb-1">당월 납부 학비 총액</span>
                    <span id="total-paid-amount" class="text-3xl font-bold text-gray-800">0원</span>
                </div>
            </div>

            <!-- 분반별 납부 현황 -->
            <div class="bg-white p-4 rounded-lg shadow-sm">
                <h3 class="font-semibold text-gray-700 mb-4 border-b pb-2">분반별 당월 납부 리스트</h3>
                <div id="class-group-list" class="space-y-4">
                    <!-- JS에서 분반별로 그룹화하여 렌더링 -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase v9 모듈 연동 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, onSnapshot, deleteDoc, doc, updateDoc } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ★ 여기에 1단계에서 복사한 firebaseConfig를 붙여넣으세요 ★
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRef = collection(db, "students");
        let studentData = []; // 로컬 캐시

        // 실시간 데이터 가져오기 (PC/모바일 동기화)
        onSnapshot(colRef, (snapshot) => {
            studentData = [];
            snapshot.docs.forEach((doc) => {
                studentData.push({ ...doc.data(), id: doc.id });
            });
            renderStudentList();
            renderOutputView();
        });

        // 학생 폼 제출 (추가 또는 수정)
        document.getElementById('student-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('doc-id').value;
            const data = {
                name: document.getElementById('s-name').value,
                school: document.getElementById('s-school').value,
                grade: document.getElementById('s-grade').value,
                classGroup: document.getElementById('s-class').value,
                regDate: document.getElementById('s-regDate').value,
                payDay: document.getElementById('s-payDay').value,
                tuition: Number(document.getElementById('s-tuition').value),
                payStatus: document.getElementById('s-payStatus').value,
                dropDate: document.getElementById('s-dropDate').value
            };

            if(id) {
                await updateDoc(doc(db, "students", id), data);
            } else {
                await addDoc(colRef, data);
            }
            window.clearForm();
        });

        // 폼 초기화 글로벌 함수
        window.clearForm = () => {
            document.getElementById('student-form').reset();
            document.getElementById('doc-id').value = '';
        };

        // 삭제 및 수정 글로벌 함수 노출
        window.deleteStudent = async (id) => {
            if(confirm("정말 삭제하시겠습니까?")) await deleteDoc(doc(db, "students", id));
        };
        
        window.editStudent = (id) => {
            const s = studentData.find(s => s.id === id);
            document.getElementById('doc-id').value = s.id;
            document.getElementById('s-name').value = s.name;
            document.getElementById('s-school').value = s.school;
            document.getElementById('s-grade').value = s.grade;
            document.getElementById('s-class').value = s.classGroup;
            document.getElementById('s-regDate').value = s.regDate;
            document.getElementById('s-payDay').value = s.payDay;
            document.getElementById('s-tuition').value = s.tuition;
            document.getElementById('s-payStatus').value = s.payStatus;
            document.getElementById('s-dropDate').value = s.dropDate || '';
            window.scrollTo(0,0);
        };

        // 입력 탭: 전체 학생 렌더링
        function renderStudentList() {
            const tbody = document.getElementById('student-list');
            tbody.innerHTML = '';
            studentData.forEach(s => {
                // 퇴원생은 희미하게 처리
                const isDropped = s.dropDate !== ""; 
                const statusColor = s.payStatus === '납부완료' ? 'text-green-600 font-bold' : 'text-red-500';
                tbody.innerHTML += `
                    <tr class="${isDropped ? 'opacity-50' : 'hover:bg-gray-50'}">
                        <td class="p-3 font-medium">${s.name}</td>
                        <td class="p-3">${s.school} / ${s.grade}</td>
                        <td class="p-3">${s.classGroup}</td>
                        <td class="p-3">${s.tuition.toLocaleString()}원 (매월 ${s.payDay}일)</td>
                        <td class="p-3 ${statusColor}">${s.payStatus}</td>
                        <td class="p-3 space-x-2">
                            <button onclick="editStudent('${s.id}')" class="text-blue-500 text-xs hover:underline">수정</button>
                            <button onclick="deleteStudent('${s.id}')" class="text-red-500 text-xs hover:underline">삭제</button>
                        </td>
                    </tr>
                `;
            });
        }

        // 출력 탭: 요약 및 분반별 렌더링
        function renderOutputView() {
            let paidCount = 0;
            let paidAmount = 0;
            const classGroups = {};

            // 재학생(퇴원일 없는 학생)만 필터링하여 납부 현황 집계
            studentData.filter(s => s.dropDate === "").forEach(s => {
                if (s.payStatus === '납부완료') {
                    paidCount++;
                    paidAmount += s.tuition;
                }
                
                if (!classGroups[s.classGroup]) classGroups[s.classGroup] = [];
                classGroups[s.classGroup].push(s);
            });

            document.getElementById('total-paid-count').innerText = `${paidCount}명`;
            document.getElementById('total-paid-amount').innerText = `${paidAmount.toLocaleString()}원`;

            const groupContainer = document.getElementById('class-group-list');
            groupContainer.innerHTML = '';
            for (const [groupName, students] of Object.entries(classGroups)) {
                let listHTML = `<div class="mb-4 bg-gray-50 p-3 rounded"><h4 class="font-bold text-blue-700 mb-2 border-b pb-1">■ ${groupName}</h4><ul class="text-sm space-y-1">`;
                students.forEach(s => {
                    const badge = s.payStatus === '납부완료' 
                        ? `<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-xs ml-2">납부완료</span>`
                        : `<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded text-xs ml-2">미납</span>`;
                    listHTML += `<li class="flex justify-between border-b border-gray-200 border-dashed pb-1">
                                    <span>${s.name} <span class="text-gray-400 text-xs">(${s.school})</span></span>
                                    <span>${s.tuition.toLocaleString()}원 ${badge}</span>
                                 </li>`;
                });
                listHTML += `</ul></div>`;
                groupContainer.innerHTML += listHTML;
            }
        }
    </script>
    
    <script>
        // 화면 전환 로직
        function switchTab(tab) {
            document.getElementById('view-input').classList.toggle('hidden', tab !== 'input');
            document.getElementById('view-output').classList.toggle('hidden', tab !== 'output');
            
            document.getElementById('tab-input').classList.toggle('tab-active', tab === 'input');
            document.getElementById('tab-input').classList.toggle('text-gray-500', tab !== 'input');
            
            document.getElementById('tab-output').classList.toggle('tab-active', tab === 'output');
            document.getElementById('tab-output').classList.toggle('text-gray-500', tab !== 'output');
        }
        
        // PWA 서비스 워커 등록
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
